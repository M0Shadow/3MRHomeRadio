<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📻 راديو المنزل - جاري الاتصال...</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #121218; color: #ffffff;
               display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; text-align: center; }
        .card { background: #1e1e2a; padding: 35px 25px; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
                max-width: 400px; width: 100%; border: 1px solid #2d2d3f; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: #4CAF50; border-radius: 50%;
                   width: 45px; height: 45px; animation: spin 0.9s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { margin: 0 0 10px 0; font-size: 20px; color: #e2e2e9; }
        p { margin: 0 0 15px 0; font-size: 14px; color: #9393a5; line-height: 1.5; }
        .btn { display: inline-block; margin-top: 15px; padding: 12px 24px; background-color: #4CAF50;
               color: #fff; text-decoration: none; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; }
        .btn:hover { background-color: #43a047; }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner" id="loader"></div>
        <h2>📻 راديو المنزل المباشر</h2>
        <p id="status-text">جاري الاتصال بالسيرفر والتحقق من النفق المباشر...</p>
        <a id="direct-link" href="https://hood-statutes-reggae-hostel.trycloudflare.com" class="btn" style="display:none;">الدخول المباشر للراديو</a>
    </div>
    <script>
        async function connectToRadio() {
            const statusText = document.getElementById('status-text');
            const directBtn = document.getElementById('direct-link');
            try {
                // Fetch dynamic status without cache
                const res = await fetch('status.json?t=' + Date.now(), { cache: 'no-store' });
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.url) {
                        // Ping live tunnel to confirm it's reachable
                        try {
                            const ping = await fetch(data.url + '/ping', { method: 'GET', mode: 'cors' });
                            if (ping.ok) {
                                statusText.innerText = "تم الاتصال بنجاح! جاري تحويلك...";
                                directBtn.href = data.url;
                                directBtn.style.display = "inline-block";
                                window.location.href = data.url;
                                return;
                            }
                        } catch (e) {
                            console.log("Tunnel ping failed, retrying...", e);
                        }
                    }
                }
            } catch (e) {
                console.log("Status fetch failed:", e);
            }
            statusText.innerText = "السيرفر يعيد تشغيل الاتصال أو جاري تجهيز النفق... سنحاول مجدداً خلال 3 ثوانٍ";
            setTimeout(connectToRadio, 3000);
        }
        connectToRadio();
    </script>
</body>
</html>
