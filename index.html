<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Connecting to Live Radio...</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center;
                padding: 50px 20px; background-color: #121212; color: #ffffff; }
        .card { max-width: 400px; margin: 0 auto; background: #1e1e1e; padding: 30px;
                 border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .btn { display: inline-block; margin-top: 20px; padding: 12px 24px; background-color: #0088cc;
                color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Radio Live Server</h2>
        <p>Redirecting you automatically to the active live stream...</p>
        <a id="manual-link" href="https://be8382f36a4bba.lhr.life" class="btn">Click Here for Direct Link</a>
    </div>
    <script>
        var liveUrl = "https://be8382f36a4bba.lhr.life";
        var noCacheUrl = liveUrl + "?_t=" + new Date().getTime();
        document.getElementById('manual-link').href = noCacheUrl;
        setTimeout(function() { window.location.replace(noCacheUrl); }, 800);
    </script>
</body>
</html>
